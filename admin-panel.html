<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - نظام مراجعة الوثائق</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #f43f5e;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        body {
            background: var(--light);
            min-height: 100vh;
            padding-top: 60px;
        }

        .header {
            background: var(--white);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            box-shadow: var(--shadow);
            z-index: 100;
        }

        .header h1 {
            font-size: 1.2rem;
            color: var(--dark);
        }

        .view-toggle {
            display: flex;
            gap: 0.5rem;
            background: var(--light);
            padding: 0.3rem;
            border-radius: 8px;
        }

        .view-toggle button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            background: none;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-toggle button.active {
            background: var(--white);
            color: var(--primary);
            box-shadow: var(--shadow);
        }

        .main-container {
            padding: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Users View Styles */
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            padding: 1rem;
            transition: opacity 0.3s ease;
        }

        /* تحديث تصميم بطاقة المستخدم */
        .user-card {
            background: var(--white);
            border-radius: 16px;
            padding: 1.8rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards;
            border: 1px solid rgba(0,0,0,0.05);
        }

        

        .user-header {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--light);
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 1.8rem;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
        }

        .user-info h3 {
            color: var(--dark);
            font-size: 1.3rem;
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .user-info p {
            color: var(--gray);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .user-info p i {
            color: var(--primary);
            font-size: 0.9rem;
        }

        /* تحديث تصميم الإحصائيات */
        .user-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* تغيير إلى عمودين فقط */
            gap: 0.8rem;
            margin: 1.5rem 0;
            padding: 0.8rem;
            background: var(--light);
            border-radius: 12px;
        }

        .stat-item {
            text-align: center;
            padding: 1rem; /* زيادة المساحة الداخلية */
            background: var(--white);
            border-radius: 10px;
            transition: all 0.3s ease;
            min-width: 0;
            overflow: hidden;
        }

        

        .stat-item .number {
            color: var(--primary);
            font-weight: 600;
            font-size: 1.3rem; /* زيادة حجم الخط قليلاً */
            margin-bottom: 0.3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-item .label {
            color: var(--gray);
            font-size: 0.9rem; /* زيادة حجم الخط قليلاً */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* إضافة تصميم لمعلومات المدرسة والمحافظة */
        .user-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1rem;
            background: var(--light);
            border-radius: 10px;
            color: var(--dark);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .meta-item:hover {
            background: var(--primary);
            color: var(--white);
        }

        .meta-item:hover i {
            color: var(--white);
        }

        .meta-item i {
            color: var(--primary);
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        /* تحديث تصميم زر العرض */
        .user-actions {
            margin-top: 1.5rem;
        }

        .action-btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 500;
        }

        .view-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
        }

        .view-btn:hover {
            
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
        }

        .view-btn i {
            font-size: 1.1rem;
        }

        /* Documents View Styles */
        .documents-container {
            display: none;
            padding: 1rem;
        }

        .documents-container.active {
            display: block;
        }

        .filters-section {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 2.5rem 0.8rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            background: var(--light);
            color: var(--dark);
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-box i {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .filters-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-group {
            min-width: 180px;
            position: relative;
        }

        .filter-group select {
            width: 100%;
            padding: 0.8rem 2.5rem 0.8rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            background: var(--light);
            color: var(--dark);
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        .filter-group::after {
            content: '\f107';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            pointer-events: none;
        }

        .filter-group select:not(:disabled):hover {
            border-color: var(--primary-light);
            background: var(--white);
        }

        .filter-group select:focus {
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .filter-group select:disabled {
            background: #f1f5f9;
            cursor: not-allowed;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .filters-section {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box,
            .filter-group {
                width: 100%;
            }
        }

        .filters-bar {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            box-shadow: var(--shadow);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            color: var(--gray);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .filter-group select,
        .filter-group input {
            padding: 0.8rem;
            border: 2px solid var(--light);
            border-radius: 8px;
            background: var(--white);
            color: var(--dark);
            transition: all 0.3s ease;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .documents-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .document-card {
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem;
            background: linear-gradient(to left, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.95));
            border-radius: 16px !important;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        

        .document-thumbnail {
            width: 140px;
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .document-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        

        .document-title {
            font-size: 1.3rem !important;
            color: #1e293b !important;
            margin-bottom: 1rem !important;
            font-weight: 600;
        }

        .document-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .info-label {
            color: #64748b;
            font-size: 0.9rem;
        }

        .info-value {
            color: #1e293b;
            font-weight: 500;
        }

        .document-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            min-width: 120px;
            padding: 0.8rem 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: center;
        }

        .view-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }

        

        .comment-btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
        }

        

        .approve-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
        }

        

        .reject-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-pending {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .status-approved {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
        }

        .status-rejected {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            overflow-y: auto;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .modal-content {
            background: var(--white);
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 900px;
            position: relative;
            margin: auto;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: var(--light);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            background: var(--primary);
            color: var(--white);
        }

        .user-details {
            background: var(--light);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .user-details h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .user-details p {
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .user-details strong {
            color: var(--gray);
            margin-left: 0.5rem;
        }

        .section-documents {
            margin-bottom: 2rem;
        }

        .section-documents h4 {
            color: var(--dark);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--light);
        }

        .logout-btn {
            background: var(--danger);
            color: var(--white);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        

        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .image-item {
            position: relative;
            padding-bottom: 100%;
            overflow: hidden;
            border-radius: 8px;
        }

        .image-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            
        }

        

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 0 1rem;
            }

            .view-toggle {
                display: none;
            }

            .users-grid {
                grid-template-columns: 1fr;
            }

            .documents-grid {
                grid-template-columns: 1fr;
            }

            .filters-bar {
                flex-direction: column;
            }

            .filter-group {
            width: 100%;
        }
        }

        /* تنسيقات شاشة التحميل */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: all 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        .loading-text {
            color: var(--dark);
            font-size: 1.1rem;
            text-align: center;
            margin-top: 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* تنسيق تحميل البطاقات */
        .user-card {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                
            }
        }

        /* تحسين تصميم نافذة المستندات */
        .documents-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .tab-button {
            padding: 0.8rem 1.2rem;
            background: var(--light);
            border: none;
            border-radius: 8px;
            color: var(--gray);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .tab-button.active {
            background: var(--primary);
            color: var(--white);
        }

        

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .document-card {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: var(--white);
            border-radius: 12px;
            margin-bottom: 1rem;
            box-shadow: var(--shadow);
        }

        .document-thumbnail {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .document-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .document-details {
            flex: 1;
        }

        .document-title {
            font-size: 1.1rem;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .document-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .info-label {
            color: var(--gray);
            font-size: 0.8rem;
        }

        .info-value {
            color: var(--dark);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .document-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .status-badge {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .status-pending {
            background: #fef3c7;
            color: #d97706;
        }

        .status-approved {
            background: #dcfce7;
            color: #16a34a;
        }

        .status-rejected {
            background: #fee2e2;
            color: #dc2626;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تحديث تنسيقات نافذة الصور */
        .modal-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            display: flex;
            justify-content: flex-end;
            z-index: 10;
        }

        .images-modal .close-modal {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        

        .images-viewer {
            position: relative;
            display: flex;
                flex-direction: column;
            gap: 1rem;
        }

        .main-image {
            position: relative;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .main-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            
        }

        .image-controls {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            
            display: flex;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.7);
            padding: 0.5rem;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        .control-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-item.pending .stat-value {

        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--gray);

</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p class="loading-text">جاري تحميل البيانات...</p>
    </div>

    <div class="main-container">
        <!-- إضافة قسم التصفية هنا مباشرة بعد بداية main-container -->
        <div class="filters-section">
            <div class="search-box">

            <div class="filters-row">

                    </select>

    <div class="modal" id="userModal">

                <!-- سيتم إضافة محتوى المستخدم هنا -->
                </div>
            </div>
        </div>

    <div class="modal images-modal" id="imagesModal">
        <div class="modal-content">

                <button class="close-modal" onclick="closeModal('imagesModal')">
                    <i class="fas fa-times"></i>
                        </button>
            </div>

                    <div class="image-controls">
                        <button onclick="zoomIn()" class="control-btn">

                        <button onclick="zoomOut()" class="control-btn">

                        </button>
                        <button onclick="resetZoom()" class="control-btn">

                        </button>
                        <button onclick="rotateImage()" class="control-btn">

                        </button>
        </div>
                    <button class="nav-btn prev-btn" onclick="prevImage()">

                    </button>

                        <!-- الصور المصغرة ستضاف هنا -->
                </div>
                    </div>
                <div class="image-info">
                    <span id="imageCounter">1 / 1</span>
                </div>
                    </div>
                </div>
            </div>
            
    <!-- إضافة نافذة التعليقات -->
    <div class="modal" id="commentsModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('commentsModal')">
                <i class="fas fa-times"></i>
                        </button>
            <div class="comments-container">
                <h3>التعليقات</h3>

                    <!-- سيتم إضافة التعليقات هنا -->

                        <i class="fas fa-paper-plane"></i>
                        إضافة تعليق
                    </button>
