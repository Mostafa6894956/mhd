    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_e0oD-74pSllN0yivBYiX-4oYbO_1PJ4",
            authDomain: "learning-8f044.firebaseapp.com",
            databaseURL: "https://learning-8f044-default-rtdb.firebaseio.com",
            projectId: "learning-8f044",
            storageBucket: "learning-8f044.firebasestorage.app",
            messagingSenderId: "453828841732",
            appId: "1:453828841732:web:99226149b359d41df64051",
            measurementId: "G-SCSBHBQM08"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // إضافة المتغيرات العامة
        window.allUsers = [];
        window.governoratesMap = {};
        window.administrationsMap = {};
        window.institutesMap = {};

        // التحقق من صلاحيات المشرف
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userRef = ref(db, `users/${user.uid}`);
                const snapshot = await get(userRef);
                const userData = snapshot.val();
                
                if (!userData || userData.userType !== 'admin') {
                loadUsers();
            } else {
                loadUsers();
            }        
            } else {
                loadUsers();
            }
        });

        // متغيرات عامة لمعرض الصور
        window.currentImages = [];
        window.currentImageIndex = 0;
        window.currentZoom = 1;
        window.currentRotation = 0;

        // متغيرات عامة للتعليقات
        let currentDocumentData = null;

        // تحديث دالة loadUsers وجعلها متاحة عالمياً
        window.loadUsers = async function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const usersGrid = document.getElementById('usersGrid');
            const loadingText = document.querySelector('.loading-text');
            
            try {
                // نعرض شاشة التحميل فقط عند أول تحميل للبيانات
                if (!window.allUsers || window.allUsers.length === 0) {
                    loadingOverlay.classList.remove('hidden');
                    usersGrid.style.display = 'none';
                }
                
                loadingText.textContent = 'جاري تحميل بيانات المستخدمين...';

                // تنظيف المتغيرات العالمية
                window.allUsers = [];
                window.governoratesMap = {};
                window.administrationsMap = {};
                window.institutesMap = {};

                loadingText.textContent = 'جاري جلب بيانات المستخدمين...';
                const usersRef = ref(db, 'users');
                const snapshot = await get(usersRef);
                const users = snapshot.val() || {};

                const processedUsers = new Map();
                let processedCount = 0;
                const totalUsers = Object.entries(users).filter(([, user]) => user.userType === 'user').length;

                for (const [uid, user] of Object.entries(users)) {
                    if (user.userType !== 'user') continue;
                    
                    processedCount++;
                    loadingText.textContent = `جاري معالجة بيانات المستخدمين (${processedCount}/${totalUsers})...`;
                    
                    // تجميع بيانات الفلاتر
                    if (user.governorate) {
                        window.governoratesMap[user.governorate] = true;
                        
                        if (user.administration) {
                            if (!window.administrationsMap[user.governorate]) {
                                window.administrationsMap[user.governorate] = {};
                            }
                            window.administrationsMap[user.governorate][user.administration] = true;
                            
                            if (user.institute) {
                                if (!window.institutesMap[user.administration]) {
                                    window.institutesMap[user.administration] = {};
                                }
                                window.institutesMap[user.administration][user.institute] = true;
                            }
                        }
                    }

                    loadingText.textContent = `جاري حساب إحصائيات المستخدم ${user.name}...`;
                    const imagesRef = ref(db, `users/${uid}/images`);
                    const imagesSnapshot = await get(imagesRef);
                    const images = imagesSnapshot.val() || {};
                    
                    let lastActivity = 0;
                    let totalDocs = 0;
                    let pendingDocs = 0;

                    Object.values(images).forEach(section => {
                        if (section) {
                            Object.values(section).forEach(doc => {
                                totalDocs++;
                                if (doc.status === 'pending') pendingDocs++;
                                if (doc && doc.uploadedAt) {
                                    const uploadTime = new Date(doc.uploadedAt).getTime();
                                    lastActivity = Math.max(lastActivity, uploadTime);
                                }
                            });
                        }
                    });

                    processedUsers.set(uid, {
                        uid,
                        user,
                        lastActivity: lastActivity || 0,
                        stats: {
                            totalDocs,
                            pendingDocs
                        }
                    });
                }

                loadingText.textContent = 'جاري ترتيب وتحضير البيانات...';
                window.allUsers = Array.from(processedUsers.values())
                    .sort((a, b) => b.lastActivity - a.lastActivity);

                updateFilters();
                
                // نخفي شاشة التحميل فقط إذا كانت ظاهرة
                if (!loadingOverlay.classList.contains('hidden')) {
                    loadingOverlay.classList.add('hidden');
                    // نظهر الشبكة فقط إذا كانت مخفية
                    if (usersGrid.style.display === 'none') {
                        usersGrid.style.display = 'grid';
                    }
                }
                
                // تحديث عرض المستخدمين مباشرة
                window.filterUsers();

            } catch (error) {
                console.error('Error loading users:', error);
                showToast('حدث خطأ في تحميل البيانات', true);
                if (!loadingOverlay.classList.contains('hidden')) {
                    loadingOverlay.classList.add('hidden');
                }
            }
        };

        // إضافة دالة تحديث الفلاتر للنافذة
        function updateFilters() {
            const governorateSelect = document.getElementById('governorateFilter');
            const administrationSelect = document.getElementById('administrationFilter');
            const instituteSelect = document.getElementById('instituteFilter');

            // تحديث قائمة المحافظات
            governorateSelect.innerHTML = '<option value="">كل المحافظات</option>';
            Object.keys(window.governoratesMap).sort().forEach(governorate => {
                governorateSelect.innerHTML += `<option value="${governorate}">${governorate}</option>`;
            });
        }

        // إضافة دوال التصفية للنافذة
        window.handleGovernorateChange = function() {
            const governorateSelect = document.getElementById('governorateFilter');
            const administrationSelect = document.getElementById('administrationFilter');
            const instituteSelect = document.getElementById('instituteFilter');
            
            const selectedGovernorate = governorateSelect.value;
            
            // إعادة تعيين الإدارات والمدارس
            administrationSelect.innerHTML = '<option value="">كل الإدارات</option>';
            instituteSelect.innerHTML = '<option value="">كل المدارس</option>';
            
            if (selectedGovernorate) {
                administrationSelect.disabled = false;
                const administrations = Object.keys(window.administrationsMap[selectedGovernorate] || {}).sort();
                administrations.forEach(administration => {
                    administrationSelect.innerHTML += `<option value="${administration}">${administration}</option>`;
                });
            } else {
                administrationSelect.disabled = true;
                instituteSelect.disabled = true;
            }
            
            window.filterUsers();
        };

        window.handleAdministrationChange = function() {
            const administrationSelect = document.getElementById('administrationFilter');
            const instituteSelect = document.getElementById('instituteFilter');
            
            const selectedAdministration = administrationSelect.value;
            
            // إعادة تعيين المدارس
            instituteSelect.innerHTML = '<option value="">كل المدارس</option>';
            
            if (selectedAdministration) {
                instituteSelect.disabled = false;
                const institutes = Object.keys(window.institutesMap[selectedAdministration] || {}).sort();
                institutes.forEach(institute => {
                    instituteSelect.innerHTML += `<option value="${institute}">${institute}</option>`;
                });
            } else {
                instituteSelect.disabled = true;
            }
            
            window.filterUsers();
        };

        // تحديث دالة filterUsers لعرض إحصائيات المستندات
        window.filterUsers = function() {
            const searchInput = document.getElementById('searchInput');
            const governorateSelect = document.getElementById('governorateFilter');
            const administrationSelect = document.getElementById('administrationFilter');
            const instituteSelect = document.getElementById('instituteFilter');
            const usersGrid = document.getElementById('usersGrid');
            
            const searchTerm = searchInput.value.toLowerCase();
            const selectedGovernorate = governorateSelect.value;
            const selectedAdministration = administrationSelect.value;
            const selectedInstitute = instituteSelect.value;
            
            const filteredUsers = window.allUsers.filter(({ user }) => {
                const nameMatch = user.name.toLowerCase().includes(searchTerm);
                const instituteMatch = user.institute.toLowerCase().includes(searchTerm);
                const searchMatch = nameMatch || instituteMatch;
                
                const governorateMatch = !selectedGovernorate || user.governorate === selectedGovernorate;
                const administrationMatch = !selectedAdministration || user.administration === selectedAdministration;
                const instituteMatch2 = !selectedInstitute || user.institute === selectedInstitute;
                
                return searchMatch && governorateMatch && administrationMatch && instituteMatch2;
            });
            
            // تحديث المحتوى مباشرة بدون إخفاء/إظهار
            usersGrid.innerHTML = filteredUsers.length === 0 ? 
                '<div class="no-results">لا توجد نتائج</div>' : 
                filteredUsers.map(({ uid, user, stats }) => `
                    <div class="user-card">
                        <div class="user-header">
                            <div class="user-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="user-info">
                                <h3>${user.name}</h3>
                                <p><i class="fas fa-phone"></i>${user.phone}</p>
                            </div>
                        </div>
                        <div class="user-meta">
                            <div class="meta-item">
                                <i class="fas fa-map-marker-alt"></i>
                                ${user.governorate}
                            </div>
                            <div class="meta-item">
                                <i class="fas fa-school"></i>
                                ${user.institute}
                            </div>
                        </div>
                        <div class="user-stats-grid">
                            <div class="stat-item">
                                <div class="stat-value">${stats.totalDocs}</div>
                                <div class="stat-label">إجمالي المستندات</div>
                            </div>
                            <div class="stat-item ${stats.pendingDocs > 0 ? 'pending' : ''}">
                                <div class="stat-value">${stats.pendingDocs}</div>
                                <div class="stat-label">قيد المراجعة</div>
                            </div>
                        </div>
                        <div class="user-actions">
                            <button class="action-btn view-btn" onclick="viewUserDetails('${uid}')">
                                <i class="fas fa-eye"></i>
                                عرض التفاصيل
                            </button>
                        </div>
                    </div>
                `).join('');
        };

        // تحميل المستخدمين عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            window.loadUsers();
        });

        // إضافة الدوال الجديدة
        function getDocumentsCount(uid) {
            const imagesRef = ref(db, `users/${uid}/images`);
            return get(imagesRef)
                .then(snapshot => {
                    const images = snapshot.val() || {};
                    let total = 0;
                    let pending = 0;
                    let approved = 0;
                    let rejected = 0;

                    Object.values(images).forEach(section => {
                        Object.values(section).forEach(doc => {
                            total++;
                            if (doc.status === 'pending') pending++;
                            if (doc.status === 'approved') approved++;
                            if (doc.status === 'rejected') rejected++;
                        });
                    });

                    return { total, pending, approved, rejected };
                })
                .catch(error => {
                    console.error('Error getting documents count:', error);
                    showToast('حدث خطأ في تحميل إحصائيات المستندات', true);
                    return { total: 0, pending: 0, approved: 0, rejected: 0 };
                });
        }

        // تحديث دالة إنشاء بطاقة المستخدم لتشمل تاريخ آخر نشاط
        function createUserCard(uid, user, documentsCount) {
            const div = document.createElement('div');
            div.className = 'user-card';
            div.innerHTML = `
                <div class="user-header">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-info">
                        <h3>${user.name}</h3>
                        <p><i class="fas fa-phone"></i>${user.phone}</p>
                    </div>
                </div>

                <div class="user-meta">
                    <div class="meta-item">
                        <i class="fas fa-map-marker-alt"></i>
                        ${user.governorate}
                    </div>
                    <div class="meta-item">
                        <i class="fas fa-school"></i>
                        ${user.institute}
                    </div>
                </div>

                <div class="user-stats">
                    <div class="stat-item">
                        <div class="number">${documentsCount.total}</div>
                        <div class="label">المستندات</div>
                    </div>
                    <div class="stat-item">
                        <div class="number">${documentsCount.pending}</div>
                        <div class="label">قيد المراجعة</div>
                    </div>
                    
                </div>

                <div class="user-actions">
                    <button class="action-btn view-btn" onclick="viewUserDetails('${uid}')">
                        <i class="fas fa-eye"></i>
                        عرض التفاصيل
                    </button>
                </div>
            `;
            return div;
        }

        // عرض تفاصيل المستخدم
        window.viewUserDetails = async function(uid) {
            // تحديد الزر وإضافة حالة التحميل
            const button = event.currentTarget;
            const originalContent = button.innerHTML;
            button.classList.add('loading');
            
            try {
                const modal = document.getElementById('userModal');
                modal.className = 'modal user-details-modal';
                const modalContent = modal.querySelector('.modal-content');
                
                const userRef = ref(db, `users/${uid}`);
                const snapshot = await get(userRef);
                const user = snapshot.val();
                const documentsCount = await getDocumentsCount(uid);

                modalContent.innerHTML = `
                    <div class="modal-header">
                        <h2>تفاصيل المستخدم</h2>
                        <button class="close-modal" onclick="closeModal('userModal')">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="user-info-grid">
                            <div class="info-card personal-info">
                                <div class="info-card-header">
                                    <div class="info-card-icon">
                                        <i class="fas fa-user"></i>
                                    </div>
                                    <h3 class="info-card-title">البيانات الشخصية</h3>
                                </div>
                                
                                <div class="info-list">
                                    
                                    <div class="info-item">
                                        <span class="info-label">الاسم</span>
                                        <span class="info-value">${user.name}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">رقم الهاتف</span>
                                        <span class="info-value">${user.phone}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">تاريخ التسجيل</span>
                                        <span class="info-value">${new Date(user.createdAt || Date.now()).toLocaleDateString('ar-EG')}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="info-card institute-info">
                                <div class="info-card-header">
                                    <div class="info-card-icon">
                                        <i class="fas fa-school"></i>
                                    </div>
                                    <h3 class="info-card-title">معلومات المعهد</h3>
                                </div>
                                <div class="info-list">
                                    <div class="info-item">
                                        <span class="info-label">المحافظة</span>
                                        <span class="info-value">${user.governorate}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">الإدارة</span>
                                        <span class="info-value">${user.administration}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">المعهد</span>
                                        <span class="info-value">${user.institute}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="info-card stats-info">
                                <div class="info-card-header">
                                    <div class="info-card-icon">
                                        <i class="fas fa-chart-pie"></i>
                                    </div>
                                    <h3 class="info-card-title">إحصائيات المستندات</h3>
                                </div>
                                <div class="info-list">
                                    <div class="info-item">
                                        <span class="info-label">إجمالي المستندات</span>
                                        <span class="info-value">${documentsCount.total}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">قيد المراجعة</span>
                                        <span class="info-value">${documentsCount.pending}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">تمت الموافقة</span>
                                        <span class="info-value">${documentsCount.approved}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">مرفوضة</span>
                                        <span class="info-value">${documentsCount.rejected}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="documents-section">
                            <div class="documents-header">
                                <h3 class="documents-title">
                                    <i class="fas fa-file-alt"></i>
                                    المستندات
                                </h3>
                            </div>
                            <div id="documentsContainer">
                                <div class="loading-spinner"></div>
                                <p class="loading-text">جاري تحميل المستندات...</p>
                            </div>
                        </div>
                    </div>
                `;

                await loadUserDocuments(uid, modalContent.querySelector('#documentsContainer'));

                modal.style.display = 'flex';
                setTimeout(() => {
                    modal.classList.add('active');
                }, 10);
            } catch (error) {
                console.error('Error loading user details:', error);
                showToast('حدث خطأ في تحميل تفاصيل المستخدم', true);
            } finally {
                // إزالة حالة التحميل وإعادة المحتوى الأصلي
                button.classList.remove('loading');
                button.innerHTML = originalContent;
            }
        };

        // تحميل مستندات المستخدم
        async function loadUserDocuments(uid, container) {
            const imagesRef = ref(db, `users/${uid}/images`);
            const snapshot = await get(imagesRef);
            const images = snapshot.val() || {};

            let tabsHtml = '<div class="documents-tabs">';
            let contentHtml = '';
            let isFirst = true;

            for (const [section, docs] of Object.entries(images)) {
                const sectionTitle = getSectionTitle(section);
                const activeClass = isFirst ? 'active' : '';
                
                // جمع الأقسام الفرعية الفريدة
                const subsections = new Set();
                Object.values(docs).forEach(doc => {
                    if (doc.subsection) {
                        subsections.add(doc.subsection);
                    }
                });
                
                tabsHtml += `
                    <button class="tab-button ${activeClass}" onclick="switchTab('${section}')">
                        ${sectionTitle}
                    </button>
                `;

                contentHtml += `
                    <div id="tab-${section}" class="tab-content ${activeClass}" data-section="${section}">
                        ${subsections.size > 0 ? `
                            <div class="subsections-filter" id="subsections-${section}">
                                <button class="subsection-btn active" onclick="filterSubsections('${section}', '')">
                                    الكل
                                </button>
                                ${Array.from(subsections).map(sub => `
                                    <button class="subsection-btn" onclick="filterSubsections('${section}', '${sub}')">
                                        ${sub}
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}
                        <div class="documents-grid">
                            ${Object.entries(docs).map(([docId, doc]) => `
                                <div class="document-card" data-id="${docId}" data-subsection="${doc.subsection || ''}">
                                    <div class="document-thumbnail">
                                        <img src="${doc[0]}" alt="${doc.title || 'مستند'}">
                                    </div>
                                    <div class="document-details">
                                        <h3 class="document-title">${doc.title || 'مستند بدون عنوان'}</h3>
                                        <div class="document-info">
                                            <div class="info-item">
                                                <span class="info-label">تاريخ الرفع</span>
                                                <span class="info-value">${new Date(doc.uploadedAt).toLocaleDateString('ar-EG')}</span>
                                            </div>
                                            ${doc.subsection ? `
                                                <div class="info-item">
                                                    <span class="info-label">القسم الفرعي</span>
                                                    <span class="info-value">${doc.subsection}</span>
                                                </div>
                                            ` : ''}
                                            <div class="info-item">
                                                <span class="info-label">الحالة</span>
                                                <span class="status-badge status-${doc.status || 'pending'}">
                                                    <i class="fas fa-${getStatusIcon(doc.status)}"></i>
                                                    ${getStatusText(doc.status)}
                                                </span>
                                            </div>
                                        </div>
                                        <div class="document-actions">
                                            <button class="action-btn view-btn" onclick="viewImages('${uid}', '${section}', '${docId}')">
                                                <i class="fas fa-images"></i>
                                                عرض الصور
                                            </button>
                                            <button class="action-btn comment-btn" onclick="showComments('${uid}', '${section}', '${docId}')">
                                                <i class="fas fa-comments"></i>
                                                التعليقات ${doc.comments ? `(${Object.keys(doc.comments).length})` : '(0)'}
                                            </button>
                                            ${doc.status !== 'approved' ? `
                                                <button class="action-btn approve-btn" onclick="updateStatus('${uid}', '${section}', '${docId}', 'approved')">
                                                    <i class="fas fa-check"></i>
                                                    موافقة
                                                </button>
                                            ` : ''}
                                            ${doc.status !== 'rejected' ? `
                                                <button class="action-btn reject-btn" onclick="updateStatus('${uid}', '${section}', '${docId}', 'rejected')">
                                                    <i class="fas fa-times"></i>
                                                    رفض
                                                </button>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;

                isFirst = false;
            }

            tabsHtml += '</div>';
            container.innerHTML = Object.keys(images).length ? tabsHtml + contentHtml : '<p>لا توجد مستندات</p>';
        }

        // تحديث دالة تبديل التبويبات
        window.switchTab = function(sectionId) {
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            document.querySelector(`.tab-button[onclick*="${sectionId}"]`).classList.add('active');
            const tabContent = document.getElementById(`tab-${sectionId}`);
            tabContent.classList.add('active');

            // إظهار فلتر الأقسام الفرعية إذا وجد
            const subsectionsFilter = document.getElementById(`subsections-${sectionId}`);
            if (subsectionsFilter) {
                subsectionsFilter.classList.add('active');
            }
        };

        // تحديث دالة تصفية الأقسام الفرعية
        window.filterSubsections = function(section, subsection) {
            const tabContent = document.getElementById(`tab-${section}`);
            const cards = tabContent.querySelectorAll('.document-card');
            const buttons = tabContent.querySelectorAll('.subsection-btn');
            
            // تحديث حالة الأزرار
            buttons.forEach(btn => {
                if (
                    (subsection === '' && btn.textContent.trim() === 'الكل') ||
                    btn.textContent.trim() === subsection
                ) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // تصفية البطاقات
            cards.forEach(card => {
                if (!subsection || card.dataset.subsection === subsection) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        };

        // دوال التحكم في الصورة
        window.viewImages = async function(uid, section, docId) {
            try {
                const docRef = ref(db, `users/${uid}/images/${section}/${docId}`);
                const snapshot = await get(docRef);
                const doc = snapshot.val();
                
                if (!doc) {
                    showToast('لم يتم العثور على المستند', true);
                    return;
                }

                // تجميع الصور من المستند
                window.currentImages = [];
                for (let key in doc) {
                    if (!isNaN(key) && doc[key]) {
                        window.currentImages.push(doc[key]);
                    }
                }
                
                if (window.currentImages.length === 0) {
                    showToast('لا توجد صور في هذا المستند', true);
                    return;
                }

                window.currentImageIndex = 0;
                window.currentZoom = 1;
                window.currentRotation = 0;

                const modal = document.getElementById('imagesModal');
                const content = modal.querySelector('.modal-content');
                
                content.innerHTML = `
                    <div class="image-viewer-header">
                        <h3 class="image-viewer-title">
                            <i class="fas fa-images"></i>
                            ${doc.title || 'عرض الصور'}
                        </h3>
                        <div class="image-viewer-controls">
                            <button class="image-viewer-btn" onclick="window.zoomIn()" title="تكبير">
                                <i class="fas fa-search-plus"></i>
                            </button>
                            <button class="image-viewer-btn" onclick="window.zoomOut()" title="تصغير">
                                <i class="fas fa-search-minus"></i>
                            </button>
                            <button class="image-viewer-btn" onclick="window.rotateImage()" title="تدوير">
                                <i class="fas fa-redo"></i>
                            </button>
                            <button class="image-viewer-btn" onclick="window.resetZoom()" title="إعادة تعيين">
                                <i class="fas fa-sync"></i>
                            </button>
                            <button class="image-viewer-btn" onclick="window.closeModal('imagesModal')" title="إغلاق">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                    <div class="image-viewer-main">
                        <div class="image-viewer-container">
                            <img id="currentImage" class="image-viewer-img" src="${window.currentImages[0]}" alt="صورة المستند">
                            <div class="image-navigation">
                                <button class="nav-btn prev-btn" onclick="window.prevImage()" ${window.currentImageIndex === 0 ? 'disabled' : ''}>
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                                <button class="nav-btn next-btn" onclick="window.nextImage()" ${window.currentImageIndex === window.currentImages.length - 1 ? 'disabled' : ''}>
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="image-thumbnails">
                        ${window.currentImages.map((url, index) => `
                            <img 
                                src="${url}" 
                                class="thumbnail ${index === 0 ? 'active' : ''}" 
                                onclick="window.showImage(${index})"
                                alt="صورة مصغرة ${index + 1}"
                            >
                        `).join('')}
                    </div>
                `;

                modal.classList.add('active');
            } catch (error) {
                console.error('Error loading images:', error);
                showToast('حدث خطأ في تحميل الصور', true);
            }
        };

        window.showImage = function(index) {
            if (index < 0 || index >= window.currentImages.length) return;
            
            window.currentImageIndex = index;
            const img = document.getElementById('currentImage');
            if (img) {
                img.src = window.currentImages[index];
                
                document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
                    thumb.classList.toggle('active', i === index);
                });
                
                const prevBtn = document.querySelector('.nav-btn:first-child');
                const nextBtn = document.querySelector('.nav-btn:last-child');
                if (prevBtn) prevBtn.disabled = index === 0;
                if (nextBtn) nextBtn.disabled = index === window.currentImages.length - 1;
                
                window.resetZoom();
            }
        };

        window.updateImageTransform = function() {
            const img = document.getElementById('currentImage');
            if (img) {
                img.style.transform = `scale(${window.currentZoom}) rotate(${window.currentRotation}deg)`;
            }
        };

        window.zoomIn = function() {
            window.currentZoom = Math.min(window.currentZoom + 0.25, 3);
            window.updateImageTransform();
        };

        window.zoomOut = function() {
            window.currentZoom = Math.max(window.currentZoom - 0.25, 0.5);
            window.updateImageTransform();
        };

        window.rotateImage = function() {
            window.currentRotation = (window.currentRotation + 90) % 360;
            window.updateImageTransform();
        };

        window.resetZoom = function() {
            window.currentZoom = 1;
            window.currentRotation = 0;
            window.updateImageTransform();
        };

        window.prevImage = function() {
            if (window.currentImageIndex > 0) {
                window.showImage(window.currentImageIndex - 1);
            }
        };

        window.nextImage = function() {
            if (window.currentImageIndex < window.currentImages.length - 1) {
                window.showImage(window.currentImageIndex + 1);
            }
        };

        window.closeModal = function(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                // إزالة الفئة النشطة
                modal.classList.remove('active');
                
                // إعادة تعيين المحتوى حسب نوع النافذة
                if (modalId === 'imagesModal') {
                    // إعادة تعيين متغيرات عارض الصور
                    window.currentImages = [];
                    window.currentImageIndex = 0;
                    window.currentZoom = 1;
                    window.currentRotation = 0;
                } else if (modalId === 'userModal') {
                    // إعادة تعيين محتوى نافذة المستخدم
                    const content = modal.querySelector('#userModalContent');
                    if (content) {
                        content.innerHTML = '';
                    }
                } else if (modalId === 'commentsModal') {
                    // إعادة تعيين محتوى نافذة التعليقات
                    const commentsList = modal.querySelector('#commentsList');
                    const commentInput = modal.querySelector('#commentInput');
                    if (commentsList) commentsList.innerHTML = '';
                    if (commentInput) commentInput.value = '';
                }

                // إزالة الخلفية المعتمة
                modal.style.display = 'none';
                setTimeout(() => {
                    modal.style.display = '';
                }, 300);
            }
        };

        // Helper Functions
        function getSectionTitle(section) {
            const titles = {
                'hierarchy': 'الهيكل التنظيمي',
                'leadership-meetings': 'اجتماعات القيادة',
                'supervisor-meetings': 'اجتماعات المشرفين',
                'family-meetings': 'اجتماعات الأسر',
                'social-specialist': 'الأخصائي الاجتماعي',
                'librarian': 'أمين المكتبة',
                'sports': 'سجل التربية الرياضية',
                'general-photos': 'صور عامة',
                'results': 'النتيجة',
                'attendance': 'الغياب',
                'domains': 'المجالات',
                'notes': 'الملاحظات',
                'training': 'وحدة التدريب',
                'committees': 'اللجان',
                'health-visitor': 'الزائرة الصحية'
            };
            return titles[section] || section;
        }

        function getStatusIcon(status) {
            const icons = {
                'pending': 'clock',
                'approved': 'check-circle',
                'rejected': 'times-circle'
            };
            return icons[status] || 'clock';
        }

        function getStatusText(status) {
            const statusTexts = {
                'pending': 'قيد المراجعة',
                'approved': 'تمت الموافقة',
                'rejected': 'مرفوض'
            };
            return statusTexts[status] || 'قيد المراجعة';
        }

        function showToast(message, isError = false) {
            Toastify({
                text: message,
                duration: 3000,
                gravity: "top",
                position: "center",
                className: isError ? "toast-error" : "toast-success",
                stopOnFocus: true
            }).showToast();
        }

        // تسجيل الخروج
        window.logout = async function() {
            try {
                await auth.signOut();
                window.location.href = 'login.html';
            } catch (error) {
                console.error(error);
                showToast('حدث خطأ أثناء تسجيل الخروج', true);
            }
        };

        // تحديث دالة عرض التعليقات
        window.showComments = async function(uid, section, docId) {
            currentDocumentData = { uid, section, docId };
            const modal = document.getElementById('commentsModal');
            const commentsList = document.getElementById('commentsList');
            
            commentsList.innerHTML = '<div class="loading-spinner"></div>';
            modal.classList.add('active');

            try {
                const commentsRef = ref(db, `users/${uid}/images/${section}/${docId}/comments`);
                const snapshot = await get(commentsRef);
                const comments = snapshot.val() || {};

                renderComments(comments);
                
                // إضافة إشعار للمستخدم
                const notificationRef = ref(db, `users/${uid}/notifications`);
                const newNotification = {
                    type: 'comment_view',
                    timestamp: Date.now(),
                    message: 'قام المشرف بمراجعة التعليقات على مستندك',
                    documentId: docId,
                    section: section
                };
                await push(notificationRef, newNotification);
                
            } catch (error) {
                console.error('Error loading comments:', error);
                commentsList.innerHTML = '<p class="error-message">حدث خطأ في تحميل التعليقات</p>';
            }
        };

        // تحديث دالة إضافة تعليق
        window.addComment = async function() {
            const commentInput = document.getElementById('commentInput');
            const text = commentInput.value.trim();
            
            if (!text || !currentDocumentData) return;

            const { uid, section, docId } = currentDocumentData;
            const commentsRef = ref(db, `users/${uid}/images/${section}/${docId}/comments`);
            
            try {
                const newComment = {
                    text,
                    timestamp: Date.now(),
                    isAdmin: true,
                    adminId: auth.currentUser.uid
                };

                const newCommentRef = await push(commentsRef, newComment);

                // تحديث واجهة المستخدم مباشرة
                const commentsList = document.getElementById('commentsList');
                const commentElement = document.createElement('div');
                commentElement.className = 'comment-item admin-comment';
                commentElement.innerHTML = `
                    <div class="comment-header">
                        <span>المشرف</span>
                        <span>${new Date(newComment.timestamp).toLocaleString('ar-EG')}</span>
                    </div>
                    <div class="comment-text">${newComment.text}</div>
                `;
                commentsList.appendChild(commentElement);
                commentsList.scrollTop = commentsList.scrollHeight;

                // تحديث عدد التعليقات في بطاقة المستند
                const card = document.querySelector(`.document-card[data-id="${docId}"]`);
                if (card) {
                    const commentBtn = card.querySelector('.comment-btn');
                    const currentCount = parseInt(commentBtn.textContent.match(/\d+/) || 0);
                    commentBtn.innerHTML = `
                        <i class="fas fa-comments"></i>
                        التعليقات (${currentCount + 1})
                    `;
                }

                commentInput.value = '';

                // إضافة إشعار للمستخدم
                const notificationRef = ref(db, `users/${uid}/notifications`);
                const newNotification = {
                    type: 'new_comment',
                    timestamp: Date.now(),
                    message: 'تم إضافة تعليق جديد من المشرف على مستندك',
                    documentId: docId,
                    section: section
                };
                await push(notificationRef, newNotification);

                showToast('تم إضافة التعليق بنجاح');
            } catch (error) {
                console.error('Error adding comment:', error);
                showToast('حدث خطأ في إضافة التعليق', true);
            }
        };

        // تحديث دالة عرض التعليقات
        function renderComments(comments) {
            const commentsList = document.getElementById('commentsList');
            
            if (Object.keys(comments).length === 0) {
                commentsList.innerHTML = '<p class="no-comments">لا توجد تعليقات</p>';
                return;
            }

            commentsList.innerHTML = Object.entries(comments)
                .sort(([,a], [,b]) => a.timestamp - b.timestamp)
                .map(([key, comment]) => `
                    <div class="comment-item ${comment.isAdmin ? 'admin-comment' : ''}">
                        <div class="comment-header">
                            <span>${comment.isAdmin ? 'المشرف' : 'المستخدم'}</span>
                            <span>${new Date(comment.timestamp).toLocaleString('ar-EG')}</span>
                        </div>
                        <div class="comment-text">${comment.text}</div>
                    </div>
                `).join('');
            
            // تحريك السكرول إلى آخر التعليقات بعد إضافة تعليق جديد
            commentsList.scrollTop = commentsList.scrollHeight;
        }

        // تحديث دالة تغيير حالة المستند
        window.updateStatus = async function(uid, section, docId, newStatus) {
            try {
                const docRef = ref(db, `users/${uid}/images/${section}/${docId}`);
                const snapshot = await get(docRef);
                const currentDoc = snapshot.val();
                
                // الحصول على عدد التعليقات الحالي
                const commentsCount = currentDoc.comments ? Object.keys(currentDoc.comments).length : 0;
                
                await update(docRef, { status: newStatus });

                // إضافة إشعار للمستخدم
                const notificationRef = ref(db, `users/${uid}/notifications`);
                const newNotification = {
                    type: 'document_status',
                    timestamp: Date.now(),
                    documentId: docId,
                    section: section,
                    status: newStatus,
                    message: newStatus === 'approved' 
                        ? 'تمت الموافقة على مستندك'
                        : 'تم رفض مستندك',
                    title: `تحديث حالة المستند في ${getSectionTitle(section)}`
                };
                await push(notificationRef, newNotification);

                // تحديث واجهة المستخدم مباشرة
                const card = document.querySelector(`.document-card[data-id="${docId}"]`);
                if (card) {
                    // تحديث شارة الحالة
                    const statusBadge = card.querySelector('.status-badge');
                    statusBadge.className = `status-badge status-${newStatus}`;
                    statusBadge.innerHTML = `
                        <i class="fas fa-${getStatusIcon(newStatus)}"></i>
                        ${getStatusText(newStatus)}
                    `;

                    // تحديث أزرار الإجراءات مع الحفاظ على عدد التعليقات
                    const actionsDiv = card.querySelector('.document-actions');
                    actionsDiv.innerHTML = `
                        <button class="action-btn view-btn" onclick="window.viewImages('${uid}', '${section}', '${docId}')">
                            <i class="fas fa-images"></i>
                            عرض الصور
                        </button>
                        <button class="action-btn comment-btn" onclick="showComments('${uid}', '${section}', '${docId}')">
                            <i class="fas fa-comments"></i>
                            التعليقات (${commentsCount})
                        </button>
                        ${newStatus !== 'approved' ? `
                            <button class="action-btn approve-btn" onclick="updateStatus('${uid}', '${section}', '${docId}', 'approved')">
                                <i class="fas fa-check"></i>
                                موافقة
                            </button>
                        ` : ''}
                        ${newStatus !== 'rejected' ? `
                            <button class="action-btn reject-btn" onclick="updateStatus('${uid}', '${section}', '${docId}', 'rejected')">
                                <i class="fas fa-times"></i>
                                رفض
                            </button>
                        ` : ''}
                    `;
                }

                // تحديث إحصائيات المستندات
                const documentsCount = await getDocumentsCount(uid);
                updateDocumentStats(documentsCount);

                showToast(newStatus === 'approved' 
                    ? 'تم الموافقة على المستند بنجاح' 
                    : 'تم رفض المستند بنجاح'
                );
            } catch (error) {
                console.error('Error updating status:', error);
                showToast('حدث خطأ أثناء تحديث حالة المستند', true);
            }
        };

        // دالة تحديث إحصائيات المستندات
        function updateDocumentStats(documentsCount) {
            const statsInfo = document.querySelector('.stats-info .info-list');
            if (statsInfo) {
                statsInfo.innerHTML = `
                    <div class="info-item">
                        <span class="info-label">إجمالي المستندات</span>
                        <span class="info-value">${documentsCount.total}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">قيد المراجعة</span>
                        <span class="info-value">${documentsCount.pending}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">تمت الموافقة</span>
                        <span class="info-value">${documentsCount.approved}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">مرفوضة</span>
                        <span class="info-value">${documentsCount.rejected}</span>
                    </div>
                `;
            }
        }
    </script>

    <!-- في نهاية الكود JavaScript -->
    
</body>
</html>
