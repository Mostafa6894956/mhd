    <style>
        :root {
            --primary-color: #2196f3;
            --secondary-color: #1976d2;
            --bg-color: #f5f5f5;
            --text-color: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg-color);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }
        .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background: white;
        border-bottom: 1px solid #eee;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .chat-title {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-color);
        margin: 0;
    }

    .back-button {
        background: none;
        border: none;
        font-size: 1.2rem;
        color: var(--primary-color);
        cursor: pointer;
        padding: 5px 10px;
        transition: all 0.3s ease;
        width: auto;
        height: auto;
    }

    .back-button:hover {
        color: var(--secondary-color);
       
        background: none;
    }

        .chat-container {
            width: 95%;
            max-width: 500px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transform-style: preserve-3d;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: linear-gradient(45deg, #f5f5f5, #fff);
        }

        .message {
            max-width: 80%;
            margin: 10px 0;
            padding: 15px;
            border-radius: 15px;
            animation: message-pop 0.3s ease-out;
            position: relative;
            transform-style: preserve-3d;
        }

        @keyframes message-pop {
            from {
                transform: scale(0.8) translateY(10px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .user {
            background: var(--primary-color);
            color: white;
            margin-left: auto;
            border-radius: 15px 15px 0 15px;
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3);
        }

        .message.bot {
            background: white;
            color: var(--text-color);
            margin-right: auto;
            border-radius: 15px 15px 15px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
            transition: opacity 0.3s ease;
            white-space: pre-line;
            line-height: 1.6;
            padding: 15px;
            max-width: 85%;
        }

        .message.bot h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .message.bot ul, .message.bot ol {
            padding-right: 20px;
            margin: 10px 0;
        }

        .message.bot li {
            margin: 5px 0;
        }

        .message.bot .highlight {
            background: #e3f2fd;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .message.bot .note {
            border-right: 3px solid var(--primary-color);
            padding: 5px 10px;
            background: #f5f5f5;
            margin: 10px 0;
        }

        .message.bot .steps {
            counter-reset: step;
            padding: 0;
        }

        .message.bot .steps li {
            list-style: none;
            position: relative;
            padding-right: 30px;
            margin: 10px 0;
        }

        .message.bot .steps li:before {
            content: counter(step);
            counter-increment: step;
            position: absolute;
            right: 0;
            top: 0;
            background: var(--primary-color);
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
        }

        .message.bot .warning {
            background: #fff3e0;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            border-right: 3px solid #ff9800;
        }

        .message.bot .tip {
            background: #e8f5e9;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            border-right: 3px solid #4caf50;
        }

        .bot.typing {
            min-width: 100px;
            min-height: 40px;
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 25px;
            background: #f5f5f5;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        #user-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--primary-color);
        }

        .send-button, .voice-button {
            min-width: 45px;
            min-height: 45px;
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
        }

        .send-button i, .voice-button i {
            font-size: 18px;
        }

        .send-button:hover, .voice-button:hover {
            background: var(--secondary-color);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .send-button, .voice-button {
                min-width: 40px;
                min-height: 40px;
                width: 40px;
                height: 40px;
            }

            .input-container {
                padding: 15px;
                gap: 8px;
            }

            #user-input {
                padding: 12px;
                font-size: 14px;
            }
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            backdrop-filter: blur(5px);
            animation: overlay-fade 0.3s ease-out;
        }

        @keyframes overlay-fade {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* تأثيرات 3D للرسائل */
        .message::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: inherit;
            transform: translateZ(-10px);
            filter: blur(10px);
            opacity: 0.5;
        }

        /* تحسينات للهاتف المحمول */
        @media (max-width: 768px) {
            .chat-header {
            padding: 12px 15px;
        }

        .chat-title {
            font-size: 1.1rem;
        }

        
            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .message {
                max-width: 90%;
            }
        }

        /* إضافة أنيميشن النقاط المتحركة */
        .loading-dots {
            display: inline-flex;
            align-items: center;
            height: 24px;
        }

        .loading-dots::after {
            content: '';
            width: 4px;
            height: 4px;
            background: var(--text-color);
            border-radius: 50%;
            margin-right: 4px;
            animation: dots 1.5s infinite;
        }

        .loading-dots::before {
            content: 'جاري الكتابة';
            margin-left: 8px;
            color: var(--text-color);
        }

        @keyframes dots {
            0%, 20% {
                box-shadow: 
                    4px 0 0 -2px var(--text-color),
                    8px 0 0 -2px var(--text-color);
            }
            40% {
                box-shadow: 
                    4px 0 0 0 var(--text-color),
                    8px 0 0 -2px var(--text-color);
            }
            60% {
                box-shadow: 
                    4px 0 0 0 var(--text-color),
                    8px 0 0 0 var(--text-color);
            }
            80%, 100% {
                box-shadow: 
                    4px 0 0 -2px var(--text-color),
                    8px 0 0 -2px var(--text-color);
            }
        }

        /* أنماط زر الإرسال/الإيقاف */
        .send-button {
            transition: all 0.3s ease;
        }

        .send-button.loading {
            background: #dc3545 !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }

        /* إضافة أنماط جديدة للتسجيل الصوتي */
        .recording-animation {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .wave-container {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 60px;
        }

        .wave-bar {
            width: 3px;
            height: 20px;
            background: #fff;
            border-radius: 3px;
            animation: wave 1s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% {
                height: 20px;
            }
            50% {
                height: 55px;
            }
        }

        .recording-timer {
            font-size: 18px;
            color: white;
            font-family: 'Cairo', sans-serif;
        }

        .recording-controls {
            display: flex;
            gap: 15px;
        }

        .recording-button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .recording-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .recording-status {
            font-size: 16px;
            color: white;
            margin-top: 10px;
        }

        /* تحسين شكل زر التسجيل */
        .voice-button {
            position: relative;
            overflow: hidden;
        }

        .voice-button.active {
            background: #dc3545;
            animation: pulse 1.5s infinite;
        }

        .voice-button.active::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: ripple 1s infinite;
        }

        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* إضافة أنماط النافذة المنبثقة للتسجيل */
        .voice-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            width: 90%;
            max-width: 400px;
            height: auto;
        }

        .voice-modal.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            visibility: visible;
        }

        .voice-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
        }

        .voice-modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .voice-modal-close:hover {
            background: rgba(255,255,255,0.1);
        }

        .voice-visualization {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .voice-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .voice-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .voice-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .voice-btn.primary {
            background: #4caf50;
        }

        .voice-btn.danger {
            background: #f44336;
        }

        .voice-status {
            text-align: center;
            color: white;
            margin-top: 15px;
            font-size: 14px;
        }

            inputContainer.appendChild(clearButton);
        }

        // دالة مسح المحادثة
        function clearChat() {
            if (confirm('هل أنت متأكد من مسح المحادثة؟')) {
                window.chatHistory = [];
                saveChatHistory();
                document.getElementById('chat-box').innerHTML = '';
            }
        }

        // تحميل البيانات عند بدء التطبيق
        document.addEventListener('DOMContentLoaded', () => {

    </script>
