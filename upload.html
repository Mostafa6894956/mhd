        // إضافة دالة لضغط الصور
        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        // زيادة الحد الأقصى للأبعاد إلى 1600
                        const MAX_SIZE = 1600;
                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height = Math.round((height * MAX_SIZE) / width);
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width = Math.round((width * MAX_SIZE) / height);
                                height = MAX_SIZE;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // زيادة جودة الضغط إلى 0.85
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, {
                                type: 'image/jpeg',
                            }));
                        }, 'image/jpeg', 0.85);
                    };
                };
            });
        }

        // تعديل دالة معالجة الملفات
        async function handleFiles(files) {
            for (const file of Array.from(files)) {
                if (file.type.startsWith('image/')) {
                    // إضافة مؤشر تحميل مؤقت
                    const tempPreview = document.createElement('div');

                        </div>
                    `;
                    previewContainer.appendChild(tempPreview);

                    try {
                        // ضغط الصورة
                        const compressedFile = await compressImage(file);
                        
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            tempPreview.innerHTML = `
                                <img src="${e.target.result}">
                                <button type="button" class="remove-btn">&times;</button>
                            `;
                            tempPreview.dataset.file = file.name;
                            tempPreview.dataset.blob = e.target.result;
                            tempPreview.querySelector('.remove-btn').onclick = () => tempPreview.remove();
                        };
                        reader.readAsDataURL(compressedFile);
                    } catch (error) {
                        tempPreview.remove();
                        console.error('خطأ في معالجة الصورة:', error);
                        showToast('حدث خطأ في معالجة الصورة', true);

        // تعديل دالة رفع الصور
        async function uploadToImgbb(file) {
            // ضغط الصورة قبل الرفع
            const compressedFile = await compressImage(file);
            
            const formData = new FormData();
            formData.append('image', compressedFile);
            formData.append('key', '3475f087530c84c6406536284cf1b5aa');

            try {
                const response = await fetch('https://api.imgbb.com/1/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    return {
                        url: data.data.url,
                        delete_url: data.data.delete_url,
                        thumbnail: data.data.thumb?.url || data.data.url
                    };
                } else {
                    throw new Error(data.error?.message || 'فشل رفع الصورة');
                }
            } catch (error) {
                console.error('خطأ في رفع الصورة:', error);
                throw error;
            }

        // تعديل دالة الرفع لحفظ القسم الفرعي الثاني
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            const docId = urlParams.get('docId');
            const section = urlParams.get('section');
            const subsection = mode === 'append' ? urlParams.get('subsection') : subsectionSelect.value;
            const subSubsection = subSubsectionSelect.value;
            const title = document.getElementById('title').value.trim();
            const previews = previewContainer.querySelectorAll('.preview-item');
            const user = auth.currentUser;
            
            if (previews.length === 0 || (!mode && (!title || (subsectionSelect.hasAttribute('required') && !subsection)))) {
                showToast('الرجاء إكمال جميع البيانات المطلوبة', true);
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.classList.add('disabled');
            loadingIndicator.style.display = 'block';
            
            try {
                const userSnapshot = await get(ref(database, 'users/' + user.uid));
                const userData = userSnapshot.val();

                if (!userData) {
                    throw new Error('لم يتم العثور على بيانات المستخدم');
                }

                const institute = userData.azharInstitute || 'غير محدد';
                const governorate = userData.governorate || 'غير محدد';

                const files = Array.from(previews).map(preview => {
                    const base64Data = preview.dataset.blob.split(',')[1];
                    const blob = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0));
                    return new File([blob], preview.dataset.file, { type: 'image/jpeg' });
                });

                const totalFiles = files.length;
                let completedFiles = 0;
                const uploadedImages = {};

                // رفع كل صورة على حدة
                for (let i = 0; i < files.length; i++) {
                    try {
                        const result = await uploadToImgbb(files[i]);
                        uploadedImages[i] = result.url;
                        
                        completedFiles++;
                        const progress = (completedFiles / totalFiles) * 100;
                        progressBar.style.width = `${progress}%`;
                        progressText.textContent = `${Math.round(progress)}%`;
                    } catch (error) {
                        console.error('خطأ في رفع الصورة:', error);
                        showToast(`فشل في رفع الصورة ${i + 1}`, true);
                        continue;
                    }
                }

                if (mode === 'append' && docId) {
                    // الحصول على المستند الحالي
                    const docRef = ref(database, `users/${user.uid}/images/${section}/${docId}`);
                    const docSnapshot = await get(docRef);
                    const currentDoc = docSnapshot.val();

                    if (!currentDoc) {
                        throw new Error('لم يتم العثور على المستند');
                    }

                    // حساب عدد الصور الحالية
                    const currentImagesCount = Object.keys(currentDoc).filter(key => 
                        typeof currentDoc[key] === 'string' && currentDoc[key].startsWith('http')
                    ).length;

                    // إضافة الصور الجديدة مع ترقيم تسلسلي
                    const updatedImages = {};
                    Object.entries(uploadedImages).forEach(([_, url], index) => {
                        updatedImages[currentImagesCount + index] = url;
                    });

                    // تحديث المستند
                    await set(docRef, {
                        ...currentDoc,
                        ...updatedImages
                    });
                } else {
                    // إنشاء مستند جديد
                    const imagesRef = ref(database, `users/${user.uid}/images/${section}`);
                    const newImageRef = push(imagesRef);
                    await set(newImageRef, {
                        title: title,
                        section: section,
                        subsection: subsection || null,
                        subSubsection: subSubsection || null,
                        ...uploadedImages,
                        uploadedAt: new Date().toISOString(),
                        status: 'pending',
                        institute: institute,
                        governorate: governorate
                    });
                }

                showToast('تم رفع الملفات بنجاح');
                setTimeout(() => {
                    window.location.href = 'gallery.html?section=' + section + 
                        (subsection ? '&subsection=' + subsection : '') +
                        (subSubsection ? '&subsubsection=' + subSubsection : '');
                }, 2000);

            } catch (error) {
                console.error(error);
                showToast(error.message || 'حدث خطأ أثناء رفع الملفات', true);
                uploadBtn.disabled = false;
                uploadBtn.classList.remove('disabled');
            } finally {
                loadingIndicator.style.display = 'none';
            }
        });

        function showToast(message, isError = false) {
            Toastify({
                text: message,
                duration: 3000,
                gravity: "top",
                position: "center",
                className: isError ? "toast-error" : "toast-success",
                stopOnFocus: true
            }).showToast();
        }
